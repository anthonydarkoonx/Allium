[package]
name = "allium-authority-cli"
version = "0.1.0"
edition = "2021"

# NOTE (same dependency policy as allium/Cargo.toml -- see its own NOTE, and
# /home/claude/rust3/PROGRESS.md): this sandbox has no crates.io access, so
# `clap`/`tokio` cannot actually be fetched here. main.rs is written against
# clap 4's well-documented derive API and is "written but unverified pending
# a real cargo build" like every tokio-touching piece of the `allium` crate
# itself. Versions/features matched to `/home/claude/rust2/allium-relay-cli/
# Cargo.toml` for consistency across all three sibling projects.
[dependencies]
allium = { path = "../allium" }
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
